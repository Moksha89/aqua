services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aqua
    ports:
      - "5432:5432"
    volumes:
      - aqua-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aqua
      MINIO_ROOT_PASSWORD: aqua-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aqua-minio:/data
volumes:
  aqua-postgres:
  aqua-minio:
