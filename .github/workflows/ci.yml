name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: aqua
      S3_SECRET_KEY: aqua-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqua/api prisma:generate
      - run: pnpm --filter @aqua/web generate:api || true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm prisma:validate
      - run: pnpm test -- --runInBand
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua_e2e?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: aqua
      S3_SECRET_KEY: aqua-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqua/api prisma:generate
      - run: PGPASSWORD=aqua psql -h localhost -U aqua -d aqua -c 'CREATE DATABASE aqua_e2e'
      - run: docker run -d --name aqua-minio -p 9000:9000 -e MINIO_ROOT_USER=aqua -e MINIO_ROOT_PASSWORD=aqua-secret minio/minio server /data
      - run: |
          for i in {1..30}; do
            curl --fail http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      - run: pnpm --filter @aqua/api exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @aqua/api test:e2e
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
