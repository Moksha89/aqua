name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: aqua
      S3_SECRET_KEY: aqua-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqua/api prisma:generate
      - run: pnpm --filter @aqua/web generate:api || true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm prisma:validate
      - run: pnpm test -- --runInBand
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: aqua
          MINIO_ROOT_PASSWORD: aqua-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aqua:aqua@localhost:5432/aqua_e2e?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: aqua
      S3_SECRET_KEY: aqua-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqua/api prisma:generate
      - run: PGPASSWORD=aqua psql -h localhost -U aqua -d aqua -c 'CREATE DATABASE aqua_e2e'
      - run: pnpm --filter @aqua/api exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm --filter @aqua/api test:e2e
